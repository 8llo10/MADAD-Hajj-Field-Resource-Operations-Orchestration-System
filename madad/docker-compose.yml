services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: madad
      POSTGRES_PASSWORD: madad
      POSTGRES_DB: madad
    ports:
      - "5434:5432"
    volumes:
      - madad_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madad -d madad"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  madad_pg:
