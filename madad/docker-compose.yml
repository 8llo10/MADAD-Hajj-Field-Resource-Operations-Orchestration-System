services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: madad
      POSTGRES_PASSWORD: madad
      POSTGRES_DB: madad
    ports: ["5432:5432"]
    volumes: [madad_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madad"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run db:seed && node dist/src/server.js"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  madad_pg:
